# ================================================
#  The Company — Telegram Bot (PROD)
#  Назначение: боевой конфиг бота и мини-админки
#  Этот файл НЕ должен хранить секреты в явном виде.
#  Все секреты читаем из переменных окружения (.env, Docker secrets, Vault).
# ================================================

[app]
# Кратко: что делает система (1–2 строки для разработчика)
name = The Company Assistant
description = Бот + Mini App: меню, анкеты, AI-ассистент, выгрузки в 1С/CRM
environment = production
# Базовый URL фронта (Mini App) — то, что открывает кнопка web_app
public_url = https://domain.com

[bot]
# Телеграм-бот: токен хранить ТОЛЬКО в окружении
token = ${BOT_TOKEN}           ; пример: env var BOT_TOKEN=123456:ABC...
server_url = ${PUBLIC_URL}     ; дублируем public_url через env
# Режим логирования: DEBUG/INFO/WARN/ERROR
log_level = INFO
# Идентификаторы, куда слать логи/ошибки/оповещения
admin_chat_id = ${ADMIN_CHAT_ID}     ; например, -1001234567890 (канал/чат)

[security]
# Разрешённые origin'ы для Mini App API (CORS)
allowed_origins = https://domain.com, http://localhost:5173
# Подпись для webhook’ов/внутренних API, если нужно
internal_api_secret = ${INTERNAL_API_SECRET}

[admins]
# Список админов Mini App и команд бота.
# Можно хранить как CSV, можно как JSON. Рекомендуется JSON — меньше ошибок:
# Пример JSON-массива ID (Telegram user_id):
ids_json = ${ADMIN_IDS_JSON}          ; пример: [12345678, 22334455]
# Если нужно по номерам телефонов (для userbot/TDLib), держите ОБОСОБЛЕННО:
phones_json = ${ADMIN_PHONES_JSON}    ; пример: ["+972501112233","+79161234567"]

[users]
# Отдельные “спец-роли” пользователей (редко изменяемые списки)
# Например, операторы, редакторы контента и т.д.
operators_ids_json = ${OPERATOR_IDS_JSON}    ; пример: [99887766, 77665544]

[webapp]
# Бэкенд для Mini App: префикс API и проверка initData
api_base = /api/admin
# Требовать подпись initData от Telegram (обязательно, не трогать)
verify_init_data = true

[ai]
# AI-провайдеры — ключи ТОЛЬКО из окружения
provider = openai
openai_api_key = ${OPENAI_API_KEY}
model_chat = gpt-4.1-mini
model_embeddings = text-embedding-3-large

[integrations.1c]
# Интеграция 1С (или любая внешняя система)
base_url = ${ONEC_BASE_URL}
token = ${ONEC_TOKEN}

[db]
# Подключение к БД
url = ${DATABASE_URL}          ; пример: postgres://user:pass@host:5432/db
# Путь к SQLite для локальной разработки (если нужен)
sqlite_path = ./database.sqlite3.db

[features]
# Быстро включать/выключать фичи без релиза
enable_assistant = true
enable_files_upload = true
enable_userbot_stats = false    ; если поднимем TDLib/Telethon worker — включим
